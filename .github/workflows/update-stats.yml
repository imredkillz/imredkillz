name: Update GitHub Stats SVGs

on:
  schedule:
    - cron: '0 0 * * *' # Si aggiorna ogni giorno a mezzanotte UTC
  workflow_dispatch:     # Ti permette di avviarlo manualmente quando vuoi

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/update-stats.mjs

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar.svg assets/langs.svg assets/stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update stats SVGs"
            git push
          fi
